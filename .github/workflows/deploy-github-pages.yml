name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.20.0"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: "pnpm"
      - name: Check if Storybook is affected
        id: affected
        run: |
          set +e
          pnpm dlx turbo@2.9.15 query affected --tasks build-storybook --packages @frey-ui/storybook --exit-code
          CODE=$?
          if [ "$CODE" -eq 1 ]; then
            echo "storybook_affected=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 0 ]; then
            echo "storybook_affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected turbo query affected exit code: $CODE"
            exit "$CODE"
          fi
      - name: Skip deploy (unaffected)
        if: steps.affected.outputs.storybook_affected == 'false'
        run: echo "No Storybook changes detected. Skipping GitHub Pages deploy."
      - uses: bitovi/github-actions-storybook-to-github-pages@ddd9d35f670cceedd2bfc444be681001b0709730 # v1.0.4
        if: steps.affected.outputs.storybook_affected == 'true'
        with:
          install_command: pnpm install --frozen-lockfile
          build_command: pnpm turbo run build-storybook --filter=@frey-ui/storybook
          path: apps/storybook/storybook-static
          checkout: false
