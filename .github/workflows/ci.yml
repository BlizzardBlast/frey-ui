name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.13.0"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Diagnose SonarCloud PR issues
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          url='https://sonarcloud.io/api/issues/search?componentKeys=BlizzardBlast_frey-ui&pullRequest=92&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=500'
          http_code="$(curl --silent --show-error --location --output /tmp/sonar.json --write-out '%{http_code}' "$url")"
          echo "SONAR_HTTP=$http_code"
          cat /tmp/sonar.json | python3 -c "import json,sys; p=json.load(sys.stdin); issues=p.get('issues', []); print(f'SONAR_ISSUE_COUNT={len(issues)}'); [print(chr(9).join([i.get('severity','-'), i.get('rule','-'), i.get('component','').split(':',1)[-1], str(i.get('line') or i.get('textRange',{}).get('startLine') or '-'), i.get('message','-').replace(chr(9),' ').replace(chr(10),' ')])) for i in issues]"

      - name: Run affected-package checks
        run: pnpm turbo run lint typecheck test build --affected

      - name: Run library coverage
        run: pnpm test:coverage

      - name: Upload LCOV coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/frey-ui/coverage/lcov.info
          flags: frey-ui
          name: frey-ui-coverage
          report_type: coverage
          fail_ci_if_error: true

      - name: Upload JUnit test report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/frey-ui/test-report.junit.xml
          flags: frey-ui-tests
          name: frey-ui-test-results
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frey-ui-test-reports
          path: |
            packages/frey-ui/coverage/lcov.info
            packages/frey-ui/test-report.junit.xml
