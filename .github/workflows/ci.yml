name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.20.0"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run affected lint, type checking, and builds
        run: pnpm turbo run lint typecheck build --affected

      - name: Run affected non-library tests
        run: pnpm turbo run test --affected --filter=!frey-ui

      - name: Check documentation coverage
        run: pnpm docs:check

      - name: Run library tests with coverage
        run: pnpm test:coverage

      - name: Upload LCOV coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: packages/frey-ui/coverage/lcov.info
          flags: frey-ui
          name: frey-ui-coverage
          report_type: coverage
          fail_ci_if_error: true

      - name: Upload JUnit test report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: packages/frey-ui/test-report.junit.xml
          flags: frey-ui-tests
          name: frey-ui-test-results
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frey-ui-test-reports
          if-no-files-found: error
          path: |
            packages/frey-ui/coverage/lcov.info
            packages/frey-ui/test-report.junit.xml
